<!DOCTYPE html>
<html lang="en">
<head>
  <title>Happy Birthday Riddhima 💜</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #7f00ff, #2b004f);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      color: #fff;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 25px;
      max-width: 94%;
      box-shadow: 0 0 25px rgba(200,120,255,0.6);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 40px;
      margin-bottom: 5px;
      color: #e6b3ff;
      text-shadow: 0 0 10px #c77dff;
    }

    h2 {
      margin-top: 5px;
      font-weight: 400;
      color: #f2d9ff;
    }

    .bts {
      font-size: 15px;
      margin-top: 8px;
      opacity: 0.9;
      color: #dab6ff;
    }

    .age {
      font-size: 18px;
      margin-top: 15px;
      font-weight: 500;
      color: #f3e8ff;
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      font-size: 17px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #c77dff, #9d4edd);
      color: white;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 0 12px rgba(199,125,255,0.7);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(199,125,255,1);
    }

    .note {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 10px;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 18px;
      animation: rise 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- Background music (NO autoplay) -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8c5f9a7c3c.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>🎂 Happy Birthday 🎉</h1>
    <h2>Dear RIDDHIMA JI 💜</h2>
    <div class="bts">💜 RIDDHIMA • CHAVAN 💜</div>

    <div class="age" id="ageCounter"></div>

    <button onclick="playMusic(); surprise()">🎁 Purple Surprise</button>
    <button onclick="playMusic(); specialMessage()">💌 Special Message</button>

    <div class="note">(🎂🎂🎂🎂🥳🎂🎂🎂🎂)</div>
  </div>

  <script>
    for (let i = 0; i < 20; i++) {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💜";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";
      document.body.appendChild(heart);
    }
  </script>

  <script>
    setTimeout(() => {
      confetti({
        particleCount: 180,
        spread: 140,
        colors: ['#9d4edd', '#c77dff', '#e0aaff']
      });
    }, 800);

    function playMusic() {
      const music = document.getElementById("music");
      music.play();
    }

    function calculateAge() {
      const dob = new Date(2009, 0, 18);
      const today = new Date();

      let years = today.getFullYear() - dob.getFullYear();
      let months = today.getMonth() - dob.getMonth();
      let days = today.getDate() - dob.getDate();

      if (days < 0) {
        months--;
        const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById("ageCounter").innerHTML =
        `🎈 Age: ${years} Years • ${months} Months • ${days} Days`;
    }
    calculateAge();

    function surprise() {
      confetti({
        particleCount: 220,
        spread: 160,
        colors: ['#9d4edd', '#c77dff', '#e0aaff']
      });

      alert(`💜 SURPRISE 💜
On your birthday, I pray to the skies above,
That every moment of your life is filled with love.
Your smile lights up my darkest day,
In every lifetime, I want you to stay my way.✨🎂`);
    }

    function specialMessage() {
      alert(
        "💖 RIDDHU 💖\n\n"+
        "Whenever you'll feel lonely (or craving for fight 😅), I am always there for you.\n"+
        "May be not in every special moment, but in your toughest ones, always.\n\n"+
        "Special sorry for those moments when I hurt you unintentionally 💔\n\n"+
        "You are very special to me.\n"+
        "May your life always be filled with smiles,\n"+
        "success, happiness & PURPLE LOVE 💜✨\n\n"+
        "I LOVE YOU SOOOOO MUCHHH 💜💜💜"
      );
    }
  </script>

</body>
</html>
